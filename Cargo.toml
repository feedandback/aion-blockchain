[package]
name = "kybernetes"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
